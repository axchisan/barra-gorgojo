# Integración continua (docs/18 fase 3, deuda de docs/16 §3.4): en cada push y pull request,
# con el catálogo de ejemplo (negocio/ es privado y no está en el repositorio).
# Lo mismo que «Antes de dar algo por terminado» de AGENTS.md: build, verificar y e2e.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # postinstall corre `pnpm preparar`: sin negocio/, copia el catálogo de ejemplo.
      - run: pnpm install --frozen-lockfile
      # Las pruebas del Worker necesitan dist/ (wrangler exige assets.directory): deuda 4 de docs/16.
      - run: pnpm build
      - run: pnpm verificar
      - run: pnpm exec playwright install --with-deps chromium
      # Las pruebas de espacio miden qué cabe en pantalla, y la app usa la fuente del sistema
      # (system-ui): en Android es Roboto; en Linux sería DejaVu Sans, más ancha. Se mide con
      # Roboto, como en los aparatos del local.
      - name: Roboto como fuente del sistema
        run: |
          sudo apt-get install -y fonts-roboto
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
            <alias><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f
          fc-match system-ui
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: test-results/
          retention-days: 7
